apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: kloud-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      nodeSelector:
        kubernetes.io/hostname: ch4n33-server
      containers:
        - name: adminer
          image: adminer:6.1.2@sha256:eb3a6f381409ea3da5157b69537dad391fe705623a74f468957384dfe579e02a
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
