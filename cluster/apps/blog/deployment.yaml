apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: kloud-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      imagePullSecrets:
        - name: ghcr-ch4n33
      containers:
        - name: blog
          image: ghcr.io/ch4n33/kloud-ca-blog@sha256:a96f430b8a36ff19705c4db2fda455e9c191b00f421ae7ab94eb8275f7f19eaa
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
              cpu: 50m
